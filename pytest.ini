[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince211
    ignore::pydantic.warnings.UnsupportedFieldAttributeWarning
    ignore::sklearn.exceptions.InconsistentVersionWarning
    ignore::DeprecationWarning:prefect.*
    ignore::DeprecationWarning:rich.*
    ignore::DeprecationWarning:pkg_resources.*
    ignore::UserWarning:pydantic_settings.*
