name: Hourly Air Quality Pipeline

on:
  schedule:
    # Runs at minute 0 past every hour (UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hourly PM2.5 Forecasting Pipeline
        run: |
          python -c "from src.orchestration.flows import pm25_hourly_pipeline; res = pm25_hourly_pipeline(); print('Pipeline Run Result:', res)"

      - name: Commit and Push Updated Forecasts & Run History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if git diff --staged --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "chore(pipeline): automated hourly PM2.5 forecast run [skip ci]"
            git push origin main
          fi
